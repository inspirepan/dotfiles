onboarding = false

# Prefix key: kept for help (prefix+?), copy mode, and other auxiliary modes.
[keys]
prefix = "ctrl+b"

# Workspaces
new_workspace = "cmd+ctrl+t"
close_workspace = "cmd+ctrl+w"

# Tabs
# new_tab is unbound; workspaces replace tabs in this setup.

# Workspaces
switch_workspace = "cmd+ctrl+1..9"

# Panes
split_vertical = "cmd+ctrl+v"
split_horizontal = "cmd+ctrl+h"
close_pane = "cmd+ctrl+x"
zoom = "cmd+ctrl+z"

# Navigate mode: cmd+ctrl+space enters, then h/j/k/l moves between panes,
# up/down switches workspaces, esc exits. Does not intercept normal input.
workspace_picker = "cmd+ctrl+space"

# Follow the host terminal light/dark appearance and switch the Herdr UI theme.
# Ghostty is set to light:blue-light,dark:blue-light-dark, so Herdr follows it.
[theme]
auto_switch = false
light_name = "tokyo-night-day"
dark_name = "tokyo-night"

# Notify when an agent finishes or needs attention in a background workspace.
name = "tokyo-night-day"
[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[experimental]
# macOS IME support: keep the candidate window tracking the cursor inside agent
# TUIs that paint their own cursor, and make prefix keys work while an IME is on.
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex", "cursor", "droid", "amp", "opencode", "copilot", "pi"]
switch_ascii_input_source_in_prefix = true

[update]
channel = "stable"

[ui]
agent_panel_sort = "priority"
# Single workspace tab: hide the tab row to save a terminal line.
hide_tab_bar_when_single_tab = true

# Show the Claude conversation title (reported as terminal title) in the agent panel.
# Only the agent subtitle line uses a darker foreground instead of the dimmed default.
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  [{ token = "agent", fg = "#5e6b8a", dim = false }],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
  [{ token = "agent", fg = "#5e6b8a", dim = false }],
]
